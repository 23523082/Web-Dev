<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baju Bekas</title>
    <link rel="stylesheet" href="gaya.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <header  class="text-5xl">
        <h1>Baju Bekas</h1>
        <p>BAJU BEKAS by Trendy Market</p>
        <button>Shop Now</button>

    </header>

    <section class="featured">
        <div class="featured-item">
            <img src="https://images.squarespace-cdn.com/content/v1/597b8104a5790a749435c296/21411cd9-af74-4110-8a87-ace7f8d838ee/KATIE%2BJOHNSON7.jpg?format=750w" alt="Model 1">
            <p>Desktop - 7</p>
        </div>
        <div class="featured-item">
            <img src="https://images.squarespace-cdn.com/content/v1/597b8104a5790a749435c296/1612291064290-ZUJ1LQKJM6D08V5LR37T/KATIE+JOHNSON3.jpg?format=750w" alt="Model 2">
            <p>Desktop - 7</p>
        </div>
        <div class="featured-item">
            <img src="https://images.squarespace-cdn.com/content/v1/597b8104a5790a749435c296/dc1a60d4-c457-4267-a981-0f193aeaefe8/KATIE%2BJOHNSON9.jpg?format=750w" alt="Model 3">
            <p>Desktop - 7</p>
        </div>
    </section>

    <section class="categories">
        <h2>Shop by Categories</h2>
        <div class="categories-grid">
            <div class="category-item">
                <img src="category1.jpg" alt="Women's Clothing">
                <p>Women's Clothing</p>
            </div>
            <div class="category-item">
                <img src="category2.jpg" alt="Men's Clothing">
                <p>Men's Clothing</p>
            </div>
            <div class="category-item">
                <img src="category3.jpg" alt="Kids' Fashion">
                <p>Kids' Fashion</p>
            </div>
            <div class="category-item">
                <img src="category4.jpg" alt="Trendy Accessories">
                <p>Trendy Accessories</p>
            </div>
        </div>
    </section>
</body>
</html>
