<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up Page</title>
    <link rel="stylesheet" href="signup.css" />
  </head>

  <body>
    <div class="form-container">
      <h2>Create Your Account</h2>

      <form action="singupscript.php" method="POST">
        <label for="email">EMAIL *</label>
        <input type="email" id="email" name="email" required />

        <label for="password">PASSWORD *</label>
        <input type="password" id="password" name="password" required />
        <ul class="password-requirements">
          <li>Please select at least 8 characters</li>
          <li>Please select at least one number</li>
          <li>Please enter one special character (!,+,-,/,:;<=>?@)</li>
        </ul>

        <label for="first-name">FIRST NAME *</label>
        <input type="text" id="first-name" name="first-name" required />

        <label for="last-name">LAST NAME *</label>
        <input type="text" id="last-name" name="last-name" required />

        <label for="dob">DATE OF BIRTH *</label>
        <div class="dob-container">
          <input type="text" id="month" name="month" placeholder="MM" required />
          <input type="text" id="day" name="day" placeholder="DD" required />
          <input type="text" id="year" name="year" placeholder="YYYY" required />
        </div>

        <label for="user-type">ACCOUNT TYPE *</label>
        <select id="user-type" name="user-type" required>
          <option value="">Select Account Type</option>
          <option value="customer">Customer</option>
          <option value="seller">Seller</option>
          <option value="admin">Admin</option>
        </select>

        <button type="submit">Sign Up</button>
        <p>Already have an account? <a href="login.html">Sign In</a></p>
      </form>
    </div>
  </body>
</html>
