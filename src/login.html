<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Baju Bekas</title>

    <!-- Link Font Awesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- Link ke file CSS eksternal -->
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <h1>My Baju Bekas Account</h1>

    <div class="social-login">
      <button class="login-btn facebook-btn"><i class="fab fa-facebook-f"></i> Login with Facebook</button>
      <button class="login-btn google-btn"><i class="fab fa-google"></i> Login with Google</button>
    </div>

    <div class="divider">OR</div>

    <form>
      <input type="email" placeholder="Enter your email" required />
      <button type="submit">Continue</button>
    </form>

    <div class="footer">
      Don't have an account?
      <a href="signIn.html" class="sign-in-link">Sign In</a>
    </div>
  </body>
</html>
