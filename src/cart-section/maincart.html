<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="maincart.css" />
    <title>Baju Bekas - CartSection</title>
  </head>
  <body>
    <header>
      <nav class="navbar">
        <div class="navbar-container">
          <!-- Shop Icon -->
          <div class="shop-icon">
            <a href="#"
              ><img src="img_profile/shop_icon.png" alt="Shop Icon"
            /></a>
          </div>
          <!-- Logo -->
          <div class="logo">
            <a href="../index.php"
              ><img src="img_profile/Logo_Icon.png" alt="Baju Bekas Logo"
            /></a>
          </div>
          <!-- Navigation Icons -->
          <div class="nav-icons">
            <div class="search-icon">
              <a href="#"
                ><img src="img_profile/icon_search.png" alt="Search Icon"
              /></a>
            </div>
            <div class="profile-icon">
              <a href="mainProfile.html"
                ><img src="img_profile/icon_profile.png" alt="Profile Icon"
              /></a>
            </div>
            <div class="menu-icon" onclick="toggleMenu()">
              <img src="img_profile/icon_menu.png" alt="Menu Icon" />
            </div>
          </div>
          <!-- Add this after the <div class="nav-icons"> -->
          <div id="menuBar" class="menu-bar hidden">
            <button class="close-menu" onclick="toggleMenu()">X</button>
            <ul class="menu-list">
              <li>New In</li>
              <li>Woman</li>
              <li>Man</li>
              <li>Child</li>
              <li>Handbags</li>
              <li>Gifts For Him</li>
              <li>Gifts For Her</li>
              <li>Payment Methods</li>
              <li>About Us</li>
            </ul>
          </div>
          <!-- Add this overlay element just inside the <body> -->
          <div id="overlay" class="overlay hidden" onclick="toggleMenu()"></div>
        </div>
      </nav>
    </header>
    <!-- MAIN SECTION -->
    <main>
      <section class="cart-section">
        <!-- List of selected products -->
        <div class="cart-items">
          <!-- Cart Item 1 -->
          <div class="cart-item">
            <input
              type="checkbox"
              class="select-item"
              data-name="Bomber Jacket"
              data-price="2318"
              checked
            />
            <img src="img/bomber-jacket.jpg" alt="Bomber Jacket" />
            <div class="item-details">
              <h3>BOMBER JACKET</h3>
              <p class="price"><s>$2,728</s> $2,318</p>
              <div class="item-options">
                <div class="color">
                  <label>Color:</label>
                  <span>Black</span>
                </div>
                <div class="size">
                  <label>Size:</label>
                  <span>46</span>
                </div>
                <div class="quantity">
                  <label>Quantity:</label>
                  <button>-</button>
                  <span>1</span>
                  <button>+</button>
                </div>
              </div>
            </div>
            <button class="remove-item">X</button>
          </div>

          <!-- Cart Item 2 -->
          <div class="cart-item">
            <input
              type="checkbox"
              class="select-item"
              data-name="Tailored Jacket"
              data-price="2728"
              checked
            />
            <img src="img/tailored-jacket.jpg" alt="Tailored Jacket" />
            <div class="item-details">
              <h3>TAILORED JACKET</h3>
              <p class="price">$2,728</p>
              <div class="item-options">
                <div class="color">
                  <label>Color:</label>
                  <span>Gray</span>
                </div>
                <div class="size">
                  <label>Size:</label>
                  <span>48</span>
                </div>
                <div class="quantity">
                  <label>Quantity:</label>
                  <button>-</button>
                  <span>1</span>
                  <button>+</button>
                </div>
              </div>
            </div>
            <button class="remove-item">X</button>
          </div>
          <!-- Tombol Tambah Produk -->
          <div class="add-more-products">
            <button onclick="redirectToProducts()">Add More Products</button>
          </div>
        </div>

        <!-- Order Summary Section -->
        <div class="order-summary">
          <h3>Order Summary</h3>
          <ul id="summary-list">
            <!-- Items will be dynamically updated -->
          </ul>
          <div class="divider"></div>
          <div class="total">
            <p>
              <strong>SALES TAX</strong>
              <span>(11% VAT based on Indonesian regulation)</span>
            </p>
            <p><strong>SHIPPING</strong> <span>Free</span></p>
            <div class="divider"></div>
            <p>
              <strong>TOTAL <span id="total-price">$0</span></strong>
            </p>
          </div>
          <button class="checkout-btn">PROCEED TO CHECKOUT</button>
        </div>
      </section>
    </main>

    <script src="maincart.js"></script>
  </body>
</html>
